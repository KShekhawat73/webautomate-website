<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAutomate.cloud | Premium IT Agency</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --accent: #60a5fa;
            --accent-glow: rgba(96, 165, 250, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            cursor: none; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 70%);
        }

        /* --- CUSTOM CURSOR --- */
        .cursor-dot, .cursor-outline {
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
        }

        .cursor-dot {
            width: 8px; height: 8px;
            background-color: var(--accent);
        }

        .cursor-outline {
            width: 40px; height: 40px;
            border: 1px solid var(--accent-glow);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* --- HEADER --- */
        header {
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }
        
        .logo { font-size: 26px; font-weight: 800; }
        .logo span { color: var(--accent); }

        .header-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-nav, .btn-login {
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: none; /* using custom cursor */
            transition: all 0.3s;
            border: none;
        }

        .btn-nav {
            background: linear-gradient(90deg, #60a5fa, #818cf8);
            color: white;
        }
        
        .btn-login {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-nav:hover, .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* --- MAIN CONTENT (From Previous Steps) --- */
        .marquee-container {
            width: 100vw; overflow: hidden; background: #111;
            padding: 20px 0; border-top: 1px solid #333; border-bottom: 1px solid #333;
            transform: rotate(-2deg) scale(1.05); margin-top: 150px;
        }
        .marquee-content {
            display: flex; white-space: nowrap; animation: scrollMarquee 20s linear infinite;
        }
        .marquee-text {
            font-size: 3rem; font-weight: 900; text-transform: uppercase;
            padding: 0 40px; color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
            transition: 0.3s;
        }
        .marquee-text:hover { color: var(--accent); -webkit-text-stroke: 0px; }

        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .flowing-menu-section {
            padding: 100px 10%; display: flex; flex-direction: column; align-items: center;
        }
        .menu-title {
            font-size: 1.5rem; color: #64748b; margin-bottom: 40px; letter-spacing: 4px; text-transform: uppercase;
        }
        .menu-item {
            position: relative; font-size: 5rem; font-weight: 900; text-transform: uppercase;
            color: transparent; -webkit-text-stroke: 2px #333; transition: 0.4s ease; margin: 10px 0;
        }
        .menu-item:hover { color: #fff; -webkit-text-stroke: 0px; }

        /* --- ROBOT LOGIN MODAL (NEW) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform: translateY(50px);
            transition: 0.4s ease;
            position: relative;
        }

        .modal-overlay.active .login-card {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: #64748b; font-size: 24px; font-weight: bold;
            transition: 0.3s;
        }
        .close-btn:hover { color: white; }

        /* Robot Design */
        .speech-bubble {
            background: white;
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .speech-bubble::after {
            content: ''; position: absolute;
            bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        .robot-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .robot-head {
            width: 100px; height: 80px;
            background: #1e293b;
            border-radius: 35%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        /* Robot Antenna */
        .robot-head::before {
            content: ''; position: absolute;
            top: -15px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 15px; background: #64748b;
        }
        .robot-head::after {
            content: ''; position: absolute;
            top: -20px; left: 50%; transform: translateX(-50%);
            width: 10px; height: 10px; background: #ef4444;
            border-radius: 50%; box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
            animation: pulseRed 1.5s infinite;
        }

        @keyframes pulseRed {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .eye {
            width: 22px; height: 22px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .pupil {
            width: 10px; height: 10px;
            background: #0f172a;
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: 0.05s ease-out;
        }

        /* When eyes close (Password field focused) */
        .eye.closed {
            height: 4px;
            border-radius: 2px;
            background: var(--accent);
        }
        .eye.closed .pupil { display: none; }

        /* Login Form Fields */
        .form-group { margin-bottom: 15px; position: relative; }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #60a5fa, #818cf8);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .submit-btn:hover {
            box-shadow: 0 0 20px var(--accent-glow);
        }

    </style>
</head>
<body>

    <!-- CUSTOM CURSOR -->
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <!-- HEADER WITH LOGIN BUTTON -->
    <header>
        <div class="logo">WebAutomate<span>.cloud</span></div>
        <div class="header-buttons">
            <button class="btn-login" id="open-login">Client Login</button>
            <button class="btn-nav">Free Consultation</button>
        </div>
    </header>

    <!-- MAIN HOMEPAGE CONTENT -->
    <div class="marquee-container">
        <div class="marquee-content">
            <div class="marquee-text">AUTOMATE OPERATIONS ✦ BUILD PORTALS ✦ SCALE FAST ✦ </div>
            <div class="marquee-text">AUTOMATE OPERATIONS ✦ BUILD PORTALS ✦ SCALE FAST ✦ </div>
        </div>
    </div>

    <section class="flowing-menu-section">
        <div class="menu-title">Our Capabilities</div>
        <div class="menu-item">Dashboards</div>
        <div class="menu-item">Workspaces</div>
        <div class="menu-item">App Scripts</div>
    </section>

    <!-- ROBOT LOGIN MODAL -->
    <div class="modal-overlay" id="login-modal">
        <div class="login-card">
            <button class="close-btn" id="close-login">✕</button>
            
            <div class="speech-bubble" id="speech-bubble">Beep boop. Who goes there?</div>
            
            <div class="robot-container">
                <div class="robot-head">
                    <div class="eye" id="left-eye"><div class="pupil"></div></div>
                    <div class="eye" id="right-eye"><div class="pupil"></div></div>
                </div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Your name or Workspace ID" autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Your email" autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Super secret password">
                </div>
                <button type="button" class="submit-btn" id="submit-login">LOG ME IN</button>
            </form>
        </div>
    </div>


    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* 1. CUSTOM CURSOR LOGIC */
        const dot = document.getElementById('cursor-dot');
        const outline = document.getElementById('cursor-outline');
        let mouseX = 0, mouseY = 0, outlineX = 0, outlineY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            dot.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
        });

        function animateCursor() {
            outlineX += (mouseX - outlineX) * 0.15;
            outlineY += (mouseY - outlineY) * 0.15;
            outline.style.transform = `translate(${outlineX}px, ${outlineY}px)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        /* 2. MODAL OPEN/CLOSE LOGIC */
        const loginModal = document.getElementById('login-modal');
        const openLoginBtn = document.getElementById('open-login');
        const closeLoginBtn = document.getElementById('close-login');

        openLoginBtn.addEventListener('click', () => {
            loginModal.classList.add('active');
        });
        
        closeLoginBtn.addEventListener('click', () => {
            loginModal.classList.remove('active');
        });

        /* 3. ROBOT INTERACTION LOGIC */
        const speechBubble = document.getElementById('speech-bubble');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-login');
        const eyes = document.querySelectorAll('.eye');
        const pupils = document.querySelectorAll('.pupil');
        let isEyesClosed = false;

        // Form field focus interactions
        usernameInput.addEventListener('focus', () => {
            speechBubble.innerText = "A visitor. State your name.";
            openEyes();
        });

        emailInput.addEventListener('focus', () => {
            speechBubble.innerText = "Typing detected. Go on, I'm watching.";
            openEyes();
        });

        passwordInput.addEventListener('focus', () => {
            speechBubble.innerText = "Ooooh, Secret! My eyes are closed.";
            closeEyes();
        });

        submitBtn.addEventListener('click', () => {
            speechBubble.innerText = "Verifying data...";
            openEyes();
            // Yahan aap apna login validation logic laga sakte hain
        });

        function closeEyes() {
            isEyesClosed = true;
            eyes.forEach(eye => eye.classList.add('closed'));
        }

        function openEyes() {
            isEyesClosed = false;
            eyes.forEach(eye => eye.classList.remove('closed'));
        }

        // Eye tracking logic (Pupils follow the cursor)
        window.addEventListener('mousemove', (e) => {
            if(isEyesClosed || !loginModal.classList.contains('active')) return;

            pupils.forEach(pupil => {
                // Get center position of the eye
                const rect = pupil.parentElement.getBoundingClientRect();
                const eyeCenterX = rect.left + rect.width / 2;
                const eyeCenterY = rect.top + rect.height / 2;

                // Calculate angle between eye and cursor
                const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
                
                // Calculate movement (limit to keep pupil inside the white eye)
                const distance = 4; // Max pixels pupil can move from center
                const moveX = Math.cos(angle) * distance;
                const moveY = Math.sin(angle) * distance;

                pupil.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
            });
        });
    </script>
</body>
</html>
