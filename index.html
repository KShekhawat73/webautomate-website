<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAutomate.cloud | Premium IT Agency</title>
    <!-- Google Fonts for that $10k Look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --accent: #60a5fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            /* Hide default cursor to use our custom one */
            cursor: none; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 70%);
        }

        /* =========================================
           1. CUSTOM PREMIUM CURSOR (Trailing Effect)
           ========================================= */
        .cursor-dot, .cursor-outline {
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
        }

        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(96, 165, 250, 0.5);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* =========================================
           2. INFINITE CAROUSEL (Marquee)
           ========================================= */
        .marquee-container {
            width: 100vw;
            overflow: hidden;
            background: #111;
            padding: 20px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            position: relative;
            transform: rotate(-2deg) scale(1.05); /* Slight tilt for 3D curved feel */
            margin-top: 50px;
            z-index: 10;
        }

        .marquee-content {
            display: flex;
            white-space: nowrap;
            animation: scrollMarquee 20s linear infinite;
        }

        .marquee-text {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 0 40px;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
            transition: 0.3s;
        }

        .marquee-text:hover {
            color: var(--accent);
            -webkit-text-stroke: 0px;
        }

        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* =========================================
           3. FLOWING MENU (Hover Image Reveal)
           ========================================= */
        .flowing-menu-section {
            padding: 150px 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .menu-title {
            font-size: 1.5rem;
            color: #64748b;
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .menu-item {
            position: relative;
            font-size: 6rem;
            font-weight: 900;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 2px #333;
            cursor: none;
            transition: 0.4s ease;
            margin: 10px 0;
            line-height: 1;
        }

        .menu-item:hover {
            color: #fff;
            -webkit-text-stroke: 0px;
        }

        /* Hover Reveal Image */
        .hover-reveal {
            position: fixed;
            width: 350px;
            height: 250px;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.8) translate(-50%, -50%);
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: -1;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .hover-reveal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- Header & Basics --- */
        header {
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
        }
        .logo { font-size: 24px; font-weight: 800; }
        .logo span { color: var(--accent); }

    </style>
</head>
<body>

    <!-- 1. CUSTOM CURSOR ELEMENTS -->
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <header>
        <div class="logo">WebAutomate<span>.cloud</span></div>
    </header>

    <!-- 2. INFINITE CAROUSEL SECTION -->
    <div class="marquee-container">
        <div class="marquee-content">
            <!-- Text repeated twice for seamless infinite loop -->
            <div class="marquee-text">AUTOMATE OPERATIONS ✦ BUILD PORTALS ✦ SCALE FAST ✦ </div>
            <div class="marquee-text">AUTOMATE OPERATIONS ✦ BUILD PORTALS ✦ SCALE FAST ✦ </div>
        </div>
    </div>

    <!-- 3. FLOWING MENU SECTION -->
    <section class="flowing-menu-section">
        <div class="menu-title">Our Capabilities</div>
        
        <!-- Menu Item 1 -->
        <div class="menu-item" data-image="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=800&auto=format&fit=crop">
            Dashboards
        </div>
        
        <!-- Menu Item 2 -->
        <div class="menu-item" data-image="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800&auto=format&fit=crop">
            Workspaces
        </div>
        
        <!-- Menu Item 3 -->
        <div class="menu-item" data-image="https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?q=80&w=800&auto=format&fit=crop">
            App Scripts
        </div>

        <!-- The Image Reveal Container -->
        <div class="hover-reveal" id="hover-reveal">
            <img src="" id="reveal-image" alt="Service Preview">
        </div>
    </section>


    <!-- JAVASCRIPT FOR PREMIUM ANIMATIONS -->
    <script>
        // 1. Custom Cursor Logic (Smooth Trailing)
        const dot = document.getElementById('cursor-dot');
        const outline = document.getElementById('cursor-outline');
        
        let mouseX = 0, mouseY = 0;
        let outlineX = 0, outlineY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Instantly move the small dot
            dot.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
        });

        // Use requestAnimationFrame for the smooth delayed outline
        function animateCursor() {
            // Lerp (Linear Interpolation) for smooth following effect
            outlineX += (mouseX - outlineX) * 0.15;
            outlineY += (mouseY - outlineY) * 0.15;
            
            outline.style.transform = `translate(${outlineX}px, ${outlineY}px)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // 2. Flowing Menu (Image Reveal Logic)
        const menuItems = document.querySelectorAll('.menu-item');
        const revealContainer = document.getElementById('hover-reveal');
        const revealImage = document.getElementById('reveal-image');

        menuItems.forEach(item => {
            // When mouse enters the text
            item.addEventListener('mouseenter', () => {
                const imageUrl = item.getAttribute('data-image');
                revealImage.src = imageUrl;
                
                revealContainer.style.opacity = '1';
                revealContainer.style.transform = `scale(1) translate(-50%, -50%)`;
                
                // Make cursor outline bigger to show interaction
                outline.style.width = '80px';
                outline.style.height = '80px';
                outline.style.backgroundColor = 'rgba(255,255,255,0.1)';
            });

            // When mouse moves over the text (Image follows mouse)
            item.addEventListener('mousemove', (e) => {
                // Move the image container to mouse position
                revealContainer.style.left = e.clientX + 'px';
                revealContainer.style.top = e.clientY + 'px';
            });

            // When mouse leaves the text
            item.addEventListener('mouseleave', () => {
                revealContainer.style.opacity = '0';
                revealContainer.style.transform = `scale(0.8) translate(-50%, -50%)`;
                
                // Reset cursor
                outline.style.width = '40px';
                outline.style.height = '40px';
                outline.style.backgroundColor = 'transparent';
            });
        });
    </script>
</body>
</html>
