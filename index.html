<style>

/* =========================================================
   WEB AUTOMATE — LIGHT PREMIUM MOTION PACK
   ========================================================= */


/* ---------- HERO AMBIENT GLOW ---------- */

.hero {
  position: relative;
}

.hero::before {
  content: "";
  position: absolute;
  width: 520px;
  height: 520px;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    radial-gradient(
      circle,
      rgba(85,233,241,.055),
      transparent 68%
    );
  pointer-events: none;
  animation: heroGlow 7s ease-in-out infinite;
}

@keyframes heroGlow {
  0%, 100% {
    opacity: .55;
    transform: translate(-50%, -50%) scale(.96);
  }

  50% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.04);
  }
}


/* ---------- HERO TEXT ---------- */

.hero h1 {
  animation:
    heroTitleIn
    .95s
    cubic-bezier(.16,1,.3,1)
    both;
}

@keyframes heroTitleIn {

  from {
    opacity: 0;
    transform: translateY(35px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* ---------- DASHBOARD FLOAT ---------- */

.system-preview {
  animation:
    dashboardFloat
    7s
    ease-in-out
    infinite;
  will-change: transform;
}

@keyframes dashboardFloat {

  0%, 100% {
    transform:
      translateY(0);
  }

  50% {
    transform:
      translateY(-7px);
  }

}


/* ---------- DASHBOARD GLOW ---------- */

.system-preview::after {
  content: "";
  position: absolute;
  inset: 0;

  pointer-events: none;

  border-radius: inherit;

  box-shadow:
    0 0 0 1px rgba(85,233,241,.02),
    0 0 50px rgba(85,233,241,.035);

  opacity: .7;

  animation:
    dashboardGlow
    5s
    ease-in-out
    infinite;
}

@keyframes dashboardGlow {

  0%, 100% {
    opacity: .45;
  }

  50% {
    opacity: .85;
  }

}


/* ---------- SERVICE CARDS ---------- */

.service-card {
  position: relative;
  overflow: hidden;
  transform: translateZ(0);

  transition:
    transform .35s cubic-bezier(.16,1,.3,1),
    border-color .35s ease,
    background .35s ease,
    box-shadow .35s ease;
}

.service-card::before {
  content: "";

  position: absolute;

  width: 170px;
  height: 170px;

  right: -70px;
  top: -70px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(85,233,241,.09),
      transparent 65%
    );

  opacity: 0;

  transition:
    opacity .35s ease;
}

.service-card:hover {
  transform:
    translateY(-7px)
    scale(1.008);

  border-color:
    rgba(85,233,241,.22);

  box-shadow:
    0 22px 55px rgba(0,0,0,.24),
    0 0 30px rgba(85,233,241,.035);
}

.service-card:hover::before {
  opacity: 1;
}


/* ---------- SERVICE ICON ---------- */

.service-icon {
  transition:
    transform .35s cubic-bezier(.16,1,.3,1),
    box-shadow .35s ease;
}

.service-card:hover .service-icon {
  transform:
    rotate(-4deg)
    scale(1.06);

  box-shadow:
    0 0 22px rgba(85,233,241,.08);
}


/* ---------- BUTTON ---------- */

.btn-primary {
  position: relative;
  overflow: hidden;
}

.btn-primary::after {
  content: "";

  position: absolute;

  top: 0;
  bottom: 0;

  left: -120px;

  width: 75px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.45),
      transparent
    );

  transform:
    skewX(-18deg);

  animation:
    buttonShine
    4.5s
    ease-in-out
    infinite;
}

@keyframes buttonShine {

  0% {
    left: -120px;
  }

  20% {
    left: 115%;
  }

  100% {
    left: 115%;
  }

}


/* ---------- WORKSPACE ---------- */

.workspace {
  position: relative;
}

.workspace-login {
  isolation: isolate;
}

.robot-eye {
  animation:
    eyePulse
    4s
    ease-in-out
    infinite;
}

@keyframes eyePulse {

  0%, 100% {
    transform:
      scale(1);
  }

  50% {
    transform:
      scale(1.035);
  }

}


/* ---------- PUPIL ---------- */

.pupil {
  animation:
    pupilPulse
    3s
    ease-in-out
    infinite;
}

@keyframes pupilPulse {

  0%, 100% {
    box-shadow:
      0 0 25px rgba(85,233,241,.30);
  }

  50% {
    box-shadow:
      0 0 42px rgba(85,233,241,.52);
  }

}


/* ---------- ARCHITECTURE RINGS ---------- */

.architecture .ring {
  animation:
    slowRotate
    22s
    linear
    infinite;
}

.architecture .ring.r2 {
  animation:
    slowRotateReverse
    30s
    linear
    infinite;
}

@keyframes slowRotate {

  from {
    transform:
      rotate(0deg);
  }

  to {
    transform:
      rotate(360deg);
  }

}

@keyframes slowRotateReverse {

  from {
    transform:
      rotate(360deg);
  }

  to {
    transform:
      rotate(0deg);
  }

}


/* ---------- ARCHITECTURE CORE ---------- */

.architecture-core {
  animation:
    corePulse
    5s
    ease-in-out
    infinite;
}

@keyframes corePulse {

  0%, 100% {
    box-shadow:
      0 0 30px rgba(85,233,241,.035);
  }

  50% {
    box-shadow:
      0 0 65px rgba(85,233,241,.075);
  }

}


/* ---------- WORKSPACE RINGS ---------- */

.workspace-login::before {
  animation:
    workspaceRing
    12s
    linear
    infinite;
}

@keyframes workspaceRing {

  from {
    transform:
      rotate(0deg)
      scale(1);
  }

  50% {
    transform:
      rotate(180deg)
      scale(1.025);
  }

  to {
    transform:
      rotate(360deg)
      scale(1);
  }

}


/* ---------- MARQUEE ---------- */

.marquee {
  will-change:
    transform;
}

.marquee span {
  transition:
    color .25s ease;
}

.marquee:hover span {
  color:
    #a9eef1;
}


/* ---------- PROCESS CARDS ---------- */

.process-card {
  position: relative;
  overflow: hidden;

  transition:
    transform .3s ease,
    background .3s ease,
    border-color .3s ease;
}

.process-card::after {
  content: "";

  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      transparent
    );

  transform:
    scaleX(0);

  transform-origin:
    center;

  transition:
    transform .45s ease;
}

.process-card:hover {
  transform:
    translateY(-4px);

  background:
    rgba(255,255,255,.035);

  border-color:
    rgba(85,233,241,.15);
}

.process-card:hover::after {
  transform:
    scaleX(1);
}


/* ---------- CTA ---------- */

.cta-box {
  position: relative;
  overflow: hidden;
}

.cta-box::before {
  content: "";

  position: absolute;

  width: 420px;
  height: 420px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-50%);

  border-radius:
    50%;

  background:
    radial-gradient(
      circle,
      rgba(85,233,241,.055),
      transparent 68%
    );

  animation:
    ctaPulse
    6s
    ease-in-out
    infinite;

  pointer-events: none;
}

.cta-box h2,
.cta-box p,
.cta-box .hero-actions,
.cta-box .section-kicker {
  position: relative;
  z-index: 2;
}

@keyframes ctaPulse {

  0%, 100% {
    transform:
      translate(-50%,-50%)
      scale(.92);

    opacity: .5;
  }

  50% {
    transform:
      translate(-50%,-50%)
      scale(1.08);

    opacity: 1;
  }

}


/* ---------- FOOTER LINK HOVER ---------- */

.footer-links a {
  transition:
    color .2s ease;
}

.footer-links a:hover {
  color:
    var(--cyan);
}


/* ---------- ERROR SCREEN ENTRY ---------- */

.wa-error-overlay.active .wa-error-page {
  animation:
    errorEnter
    .55s
    cubic-bezier(.16,1,.3,1)
    both;
}

@keyframes errorEnter {

  from {
    opacity: 0;
    transform:
      translateY(20px)
      scale(.985);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }

}


/* ---------- SECTION REVEAL ---------- */

.reveal {
  transform:
    translateY(28px);

  opacity:
    0;

  transition:
    opacity .7s cubic-bezier(.16,1,.3,1),
    transform .7s cubic-bezier(.16,1,.3,1);
}

.reveal.visible {
  transform:
    translateY(0);

  opacity:
    1;
}


/* ---------- REDUCE MOTION ---------- */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation:
      none !important;

    transition:
      none !important;
  }

}

</style>
